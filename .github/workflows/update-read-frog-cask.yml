name: Update Read Frog Cask

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update-read-frog-cask
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Verify release and publish cask
    runs-on: macos-latest

    steps:
      - name: Checkout tap
        uses: actions/checkout@v7

      - name: Resolve latest stable Read Frog release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag=$(gh api repos/stellarjmr/read-frog/releases/latest --jq .tag_name 2>/dev/null); then
            echo "No stable Read Frog release is available yet"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=${tag#v}
          app_asset="Read-Frog-${version}-macos-unsigned.zip"
          asset_names=$(gh api "repos/stellarjmr/read-frog/releases/tags/$tag" --jq '.assets[].name')
          if ! grep -Fxq "$app_asset" <<< "$asset_names" || ! grep -Fxq "read-frog.rb" <<< "$asset_names"; then
            echo "Unsigned app or cask metadata is not available on $tag yet"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app_asset=$app_asset" >> "$GITHUB_OUTPUT"

      - name: Download release contract
        if: steps.release.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/read-frog-release"
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo stellarjmr/read-frog \
            --pattern "${{ steps.release.outputs.app_asset }}" \
            --pattern read-frog.rb \
            --dir "$RUNNER_TEMP/read-frog-release"

      - name: Verify checksum and unsigned app contract
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/read-frog-release"
          app_zip="$release_dir/${{ steps.release.outputs.app_asset }}"
          cask_file="$release_dir/read-frog.rb"
          expected_sha=$(sed -n 's/^  sha256 "\([a-f0-9]\{64\}\)"$/\1/p' "$cask_file")
          actual_sha=$(shasum -a 256 "$app_zip" | awk '{print $1}')

          test -n "$expected_sha"
          test "$actual_sha" = "$expected_sha"
          grep -Fq 'cask "read-frog"' "$cask_file"
          grep -Fq 'version "${{ steps.release.outputs.version }}"' "$cask_file"
          grep -Fq 'stellarjmr/read-frog/releases/download/v#{version}/Read-Frog-#{version}-macos-unsigned.zip' "$cask_file"
          grep -Fq 'ad-hoc signed and is not notarized by Apple' "$cask_file"
          grep -Fq 'Allow unsigned extensions' "$cask_file"

          mkdir -p "$RUNNER_TEMP/read-frog-app"
          ditto -x -k "$app_zip" "$RUNNER_TEMP/read-frog-app"
          app_path="$RUNNER_TEMP/read-frog-app/Read Frog.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_details=$(codesign --display --verbose=4 "$app_path" 2>&1)
          grep -Fq 'Signature=adhoc' <<< "$signature_details"
          if grep -Fq 'Authority=' <<< "$signature_details"; then
            echo "Unexpected Developer ID authority on the declared unsigned release" >&2
            exit 1
          fi

          if spctl --assess --type execute --verbose=2 "$app_path"; then
            echo "Gatekeeper unexpectedly accepted the declared unsigned release" >&2
            exit 1
          fi
          echo "Gatekeeper rejection is expected for this unsigned release"

          if xcrun stapler validate "$app_path"; then
            echo "Unexpected notarization ticket on the declared unsigned release" >&2
            exit 1
          fi
          echo "Missing notarization ticket is expected for this unsigned release"

      - name: Install and audit cask definition
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          cp "$RUNNER_TEMP/read-frog-release/read-frog.rb" Casks/read-frog.rb
          brew style Casks/read-frog.rb
          brew tap stellarjmr/tool
          installed_tap=$(brew --repository stellarjmr/tool)
          cp Casks/read-frog.rb "$installed_tap/Casks/read-frog.rb"
          brew audit --cask --strict stellarjmr/tool/read-frog
          brew install --cask stellarjmr/tool/read-frog
          test -d "/Applications/Read Frog.app"
          codesign --verify --deep --strict --verbose=2 "/Applications/Read Frog.app"
          brew uninstall --cask stellarjmr/tool/read-frog

      - name: Commit cask update
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- Casks/read-frog.rb)" ]; then
            echo "Cask is already current"
            exit 0
          fi

          git config user.name "stellarjmr"
          git config user.email "219479939+stellarjmr@users.noreply.github.com"
          git add Casks/read-frog.rb
          git commit -m "chore(cask): update read-frog to ${{ steps.release.outputs.version }}"
          git push origin HEAD:main
